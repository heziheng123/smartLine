<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Smart Timeline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #f5f7fb; }
      #root { min-height: 100%; }
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-card { text-align: center; }
      .boot-logo {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        place-items: center;
        border-radius: 22px;
        color: #3568e8;
        background: #e9f1ff;
        box-shadow: 0 12px 32px rgba(53, 104, 232, .16);
      }
      .boot-title { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
      .boot-status { margin: 11px 0 0; color: #6b7485; font-size: 14px; }
      .boot-spinner {
        width: 22px;
        height: 22px;
        margin: 22px auto 0;
        border: 3px solid #dbe5f5;
        border-top-color: #3568e8;
        border-radius: 50%;
        animation: boot-spin .8s linear infinite;
      }
      .boot-retry {
        display: none;
        min-height: 40px;
        margin: 20px auto 0;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: #172033;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      .boot-screen[data-delayed="true"] .boot-spinner { display: none; }
      .boot-screen[data-delayed="true"] .boot-retry { display: inline-flex; align-items: center; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-live="polite">
        <section class="boot-card">
          <div class="boot-logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="42" height="42">
              <rect x="6" y="7" width="36" height="34" rx="9" fill="currentColor" opacity=".14"></rect>
              <path d="M15 29.5V20a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
              <path d="m17 27 5-5 4 4 5-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M13 33h22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
            </svg>
          </div>
          <h1 class="boot-title">Smart Timeline</h1>
          <p class="boot-status">正在启动工作台…</p>
          <div class="boot-spinner" aria-hidden="true"></div>
          <button id="boot-retry" class="boot-retry" type="button">重新加载</button>
        </section>
      </main>
    </div>
    <noscript>Smart Timeline 需要启用 JavaScript 才能运行。</noscript>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
