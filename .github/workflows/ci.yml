name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:security
      - run: npm run lint
      - run: npm run build
      - run: npm run test:auth
      - run: npm run test:sync
      - run: npm run test:duration
      - run: npm run test:life-map
      - run: npm run test:project-shift
      - run: npm run test:planning
      - run: npm run test:system
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test tests/e2e/sync-migration-ui.spec.ts --project=desktop-chromium
        env:
          MIGRATION_UI_TEST: '1'
          VITE_LIVEBLOCKS_AUTH_ENDPOINT: /api/liveblocks-auth
